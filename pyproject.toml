[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gf5-minors"
version = "0.1.0"
description = "Auditable small-matroid experiments for GF(5) excluded minors"
requires-python = ">=3.11"
dependencies = ["python-sat==1.9.dev15"]

[tool.setuptools.packages.find]
include = ["gf5minors*"]

